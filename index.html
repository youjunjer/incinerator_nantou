<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>南投焚化廠場址風險地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f3;color:#17211b}.app{height:100vh;display:grid;grid-template-columns:360px 1fr}.panel{padding:20px;background:#fff;border-right:1px solid #d7d9cf;overflow:auto}.map{height:100vh}h1{font-size:22px;margin:0 0 10px}h2{font-size:15px;margin:20px 0 8px}p,li{color:#5b655f;line-height:1.55}.notice{padding:10px;border:1px solid #efc7b8;background:#fff4ee;border-radius:8px;color:#71331e;font-size:14px}.score{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center;margin:12px 0;padding:12px;border:1px solid #d7d9cf;border-radius:8px;background:#fbfbf8}.dial{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;background:#197278}.field{display:grid;gap:5px;margin:8px 0}.field label{font-size:12px;color:#5b655f}input,button{width:100%;min-height:40px;border-radius:8px;border:1px solid #d7d9cf;padding:8px 10px;font:inherit}button{border:0;background:#197278;color:#fff;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.legend{display:grid;gap:6px;font-size:13px}.sw{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:middle}@media(max-width:850px){.app{grid-template-columns:1fr}.map{height:65vh}.panel{height:auto;border-right:0;border-bottom:1px solid #d7d9cf}}
  </style>
</head>
<body>
<div class="app">
  <aside class="panel">
    <h1>南投焚化廠場址風險地圖</h1>
    <p>拖曳紅色場址或點擊地圖，會即時重新估算 10 公里範圍內敏感點與場址建議指數。</p>
    <div class="notice">線上展示入口已建立。完整本機版含 496 筆南投縣敏感點資料；此頁先提供可展示的互動模型與主要敏感點樣本。</div>
    <h2>場址座標</h2>
    <div class="row">
      <div class="field"><label>緯度</label><input id="lat" type="number" step="0.000001"></div>
      <div class="field"><label>經度</label><input id="lng" type="number" step="0.000001"></div>
    </div>
    <button id="apply">套用座標</button>
    <div class="score">
      <div class="dial" id="score">--</div>
      <div><strong id="label">等待計算</strong><p id="summary">移動場址後會更新。</p></div>
    </div>
    <h2>判斷依據</h2>
    <ul id="reasons"></ul>
    <h2>圖例</h2>
    <div class="legend">
      <div><span class="sw" style="background:#c94b35"></span>高風險敏感點</div>
      <div><span class="sw" style="background:#e4a93c"></span>中風險敏感點</div>
      <div><span class="sw" style="background:#93b65c"></span>低風險敏感點</div>
      <div><span class="sw" style="background:#197278"></span>水體/集水區敏感位置</div>
    </div>
  </aside>
  <main id="map" class="map"></main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const defaultSite={lat:23.8136,lng:120.6996};
let site={...defaultSite};
const sensitive=[
['南投醫院','醫療設施',23.9141,120.6853],['佑民醫院','醫療設施',23.9767,120.6821],['埔里基督教醫院','醫療設施',23.9665,120.9694],['竹山秀傳醫院','醫療設施',23.7571,120.6818],['南投高中','文教設施',23.9086,120.6842],['中興高中','文教設施',23.9506,120.6924],['南投國小','文教設施',23.9072,120.6848],['名間國小','文教設施',23.8384,120.7026],['新街國小','文教設施',23.8754,120.6977],['名間國中','文教設施',23.8365,120.7038],['僑興國小','文教設施',23.8131,120.6928],['弓鞋國小','文教設施',23.8288,120.6761],['田豐國小','文教設施',23.8139,120.7154],['草屯國小','文教設施',23.9792,120.6816],['草屯國中','文教設施',23.9775,120.6887],['旭光高中','文教設施',23.9515,120.6845],['埔里國小','文教設施',23.9635,120.9679],['魚池國小','文教設施',23.8969,120.9362],['水里國小','文教設施',23.8169,120.8548],['集集國小','文教設施',23.8277,120.7853],['鹿谷國小','文教設施',23.7467,120.7531],['中寮國小','文教設施',23.8784,120.7663],['國姓國小','文教設施',24.0402,120.8582],['仁愛國中','文教設施',24.0238,121.1329],['信義國小','文教設施',23.6993,120.8566]
];
const water=[['濁水溪名間段',23.815,120.707],['烏溪草屯段',24.01,120.68],['貓羅溪南投段',23.91,120.69],['日月潭水庫',23.852,120.914],['明潭水庫',23.832,120.866],['集集攔河堰',23.811,120.706],['水里溪',23.81,120.855],['陳有蘭溪',23.7,120.855]];
const map=L.map('map').setView([23.88,120.82],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(map);
const marker=L.marker([site.lat,site.lng],{draggable:true}).addTo(map).bindPopup('候選場址');
const rings=L.layerGroup().addTo(map),pts=L.layerGroup().addTo(map),waters=L.layerGroup().addTo(map);
function dist(a,b){const r=Math.PI/180,dlat=(b.lat-a.lat)*r,dlng=(b.lng-a.lng)*r,la1=a.lat*r,la2=b.lat*r;const h=Math.sin(dlat/2)**2+Math.cos(la1)*Math.cos(la2)*Math.sin(dlng/2)**2;return 6371*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}
function color(s){return s>=62?'#c94b35':s>=44?'#e4a93c':'#93b65c'}
function risk(d,type){let base=d<=1?78:d<=3?64:d<=5?52:d<=10?36:18;if(type==='醫療設施')base*=1.18;return Math.round(base)}
function redraw(){document.getElementById('lat').value=site.lat.toFixed(6);document.getElementById('lng').value=site.lng.toFixed(6);marker.setLatLng([site.lat,site.lng]);rings.clearLayers();pts.clearLayers();waters.clearLayers();[1,3,5,10].forEach(k=>L.circle([site.lat,site.lng],{radius:k*1000,color:k===10?'#5f7f3f':'#bd4a2f',weight:2,fillOpacity:.03}).addTo(rings));let near=[],medical=0,high=0;sensitive.forEach(p=>{const o={lat:p[2],lng:p[3]},d=dist(site,o);if(d>10)return;const s=risk(d,p[1]);if(p[1]==='醫療設施')medical++;if(s>=62)high++;near.push({p,d,s});L.circleMarker([p[2],p[3]],{radius:Math.max(6,Math.min(18,s/5)),color:'#fff',weight:2,fillColor:color(s),fillOpacity:.9}).addTo(pts).bindPopup(`<b>${p[0]}</b><br>${p[1]}<br>距離 ${d.toFixed(2)} km<br>嚴重程度 ${s}`)});let nearestWater={d:999,n:''};water.forEach(w=>{const d=dist(site,{lat:w[1],lng:w[2]});if(d<nearestWater.d)nearestWater={d,n:w[0]};L.circleMarker([w[1],w[2]],{radius:7,color:'#fff',weight:2,fillColor:'#197278',fillOpacity:.95}).addTo(waters).bindPopup(`<b>${w[0]}</b><br>距離 ${d.toFixed(2)} km`)});let score=100,reasons=[];if(nearestWater.d<=1){score-=45;reasons.push(`距 ${nearestWater.n} ${nearestWater.d.toFixed(2)} km，接近水體/集水區，不建議。`)}else if(nearestWater.d<=3){score-=28;reasons.push(`距 ${nearestWater.n} ${nearestWater.d.toFixed(2)} km，需避開集水區風險。`)}else{reasons.push(`最近水體/集水區距離 ${nearestWater.d.toFixed(2)} km。`)}score-=Math.min(25,near.length*2);score-=Math.min(15,medical*4);score-=Math.min(18,high*5);score=Math.max(0,Math.round(score));document.getElementById('score').textContent=score;document.getElementById('score').style.background=score>=72?'#93b65c':score>=50?'#e4a93c':'#c94b35';document.getElementById('label').textContent=score>=72?'相對較適合':score>=50?'需審慎評估':'不建議設置';document.getElementById('summary').textContent=`10 公里內顯示 ${near.length} 個敏感點，其中醫療設施 ${medical} 個，高嚴重程度 ${high} 個。`;document.getElementById('reasons').innerHTML=reasons.map(x=>`<li>${x}</li>`).join('');}
marker.on('dragend',e=>{const p=e.target.getLatLng();site={lat:p.lat,lng:p.lng};redraw()});map.on('click',e=>{site={lat:e.latlng.lat,lng:e.latlng.lng};redraw()});document.getElementById('apply').onclick=()=>{site={lat:+document.getElementById('lat').value,lng:+document.getElementById('lng').value};redraw()};redraw();
</script>
</body>
</html>
